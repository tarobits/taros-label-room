<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>$heading</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    table { border-spacing: 0; }
    a:focus-visible { outline: 3px solid #818cf8; outline-offset: 4px; }
    @media only screen and (max-width: 600px) {
      .outer { padding: 20px 12px !important; }
      .brand { padding: 24px 24px 0 !important; }
      .content { padding: 16px 24px 28px !important; }
      .footer { padding: 22px 24px 24px !important; }
      h1 { font-size: 26px !important; line-height: 32px !important; }
    }
    @media (prefers-color-scheme: dark) {
      .page { background-color: #111318 !important; }
      .paper { background-color: #24262d !important; }
      .ink { color: #f5f3ef !important; }
      .muted { color: #c4c2cd !important; }
      .footer, .perforation { border-color: #50515f !important; }
      .action { background-color: #a5b4fc !important; color: #171b36 !important; }
    }
    /* Outlook variants that expose their own dark-mode attribute. */
    [data-ogsc] .page { background-color: #111318 !important; }
    [data-ogsc] .paper { background-color: #24262d !important; }
    [data-ogsc] .ink { color: #f5f3ef !important; }
    [data-ogsc] .muted { color: #c4c2cd !important; }
    [data-ogsc] .footer, [data-ogsc] .perforation { border-color: #50515f !important; }
    [data-ogsc] .action { background-color: #a5b4fc !important; color: #171b36 !important; }
  </style>
</head>
<body class="page" style="margin:0;padding:0;background-color:#f6f1e9">
  <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f6f1e9" style="width:100%;background-color:#f6f1e9;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <tr><td class="outer" align="center" style="padding:40px 16px">
      <!--[if mso]><table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="paper ink" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:580px;table-layout:fixed;background-color:#ffffff;color:#27282e;border-radius:16px">
        <tr><td class="brand ink" style="padding:28px 32px 0;color:#27282e;font-size:20px;font-weight:650;line-height:28px">Taro's Label Room</td></tr>
        <tr><td align="center" style="padding:24px 24px 0">
          <img src="cid:$illustration_cid" width="180" height="120" alt="" role="presentation" style="display:block;width:180px;max-width:100%;height:auto;border:0">
        </td></tr>
        <tr><td class="content ink" style="padding:20px 32px 32px;color:#27282e;font-size:16px;line-height:26px;overflow-wrap:anywhere;word-break:break-word">
          <h1 style="margin:0 0 20px;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-0.6px">$heading</h1>
          $body
          $action
          $note
        </td></tr>
        $footer
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
